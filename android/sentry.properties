defaults.url=https://sentry.io/
defaults.org=mychama
defaults.project=mychama-app

# Disable Sentry upload for local builds - enable with SENTRY_ENABLED=true
# For CI/release builds, ensure SENTRY_AUTH_TOKEN is set
sentry.enabled=false
sentry.uploadSkipIfEmpty=true

# Using SENTRY_AUTH_TOKEN environment variable for auth